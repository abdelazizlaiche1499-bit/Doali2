<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Image Switch</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;

    background:
        radial-gradient(circle at center,
        #263b73 0%,
        #111a3d 45%,
        #070b1d 100%);

    font-family: Arial, sans-serif;
}

/* الدائرة */
.image-container {
    width: min(78vw, 78vh);
    height: min(78vw, 78vh);

    border-radius: 50%;
    overflow: hidden;

    position: relative;

    border: 4px solid rgba(255,255,255,0.25);

    box-shadow:
        0 0 25px rgba(80,130,255,0.45),
        0 0 70px rgba(80,130,255,0.20);

    cursor: pointer;

    outline: none !important;
    user-select: none;

    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;

    isolation: isolate;
}

/* منع المربع الأزرق عند الضغط */
.image-container:focus,
.image-container:focus-visible,
.image-container:active {
    outline: none !important;
}

/* الصور */
.image-container img {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    border: none;
    outline: none;

    user-select: none;
    -webkit-user-drag: none;

    transition:
        opacity 0.25s ease,
        transform 0.25s ease;
}

/* إخفاء الصورة الثانية في البداية */
#image2 {
    opacity: 0;
}

/* عند التغيير */
.image-container.change #image1 {
    opacity: 0;
}

.image-container.change #image2 {
    opacity: 1;
}
</style>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4b6cb7">
<link rel="apple-touch-icon" href="icon.png"></head>

<body>

<div class="image-container" id="imageContainer" tabindex="-1">

    <img
        id="image1"
        src="https://i.ibb.co/HJY8jVL/file-000000001f50820aa73aeb0bb2fa1902.png"
        draggable="false"
        alt="Image 1"
    >

    <img
        id="image2"
        src="https://i.ibb.co/hJZjgfn6/file-00000000ced88210a9ad9ee381c6efb0.png"
        draggable="false"
        alt="Image 2"
    >

</div>

<script>
const container = document.getElementById("imageContainer");

container.addEventListener("click", function () {
    this.classList.toggle("change");

    // إزالة التركيز حتى لا يظهر أي مربع أزرق
    this.blur();
});
</script>


<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));}</script>
</body>
</html>
